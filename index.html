<!DOCTYPE html>

<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GALAXY CALC</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>

/* ======================================
   GALAXY CALCULATOR
====================================== */

:root{

  --bg1:#020617;
  --bg2:#0f172a;

  --cyan:#00e5ff;
  --purple:#7c3aed;
  --pink:#ff008c;
  --gold:#ffd700;

  --white:#e2e8f0;

}

/* RESET */

*{

  margin:0;
  padding:0;
  box-sizing:border-box;

}

body{

  min-height:100vh;

  display:flex;

  justify-content:center;

  align-items:center;

  overflow:hidden;

  font-family:'Poppins',sans-serif;

  background:
  radial-gradient(circle at top left,#00e5ff22,transparent 25%),
  radial-gradient(circle at bottom right,#7c3aed33,transparent 25%),
  linear-gradient(135deg,#020617,#0f172a,#020617);

  position:relative;

}

/* ESTRELLAS */

body::before{

  content:'';

  position:absolute;

  width:100%;
  height:100%;

  background-image:
  radial-gradient(#ffffff22 1px,transparent 1px);

  background-size:45px 45px;

  animation:stars 18s linear infinite;

}

@keyframes stars{

  from{
    transform:translateY(0);
  }

  to{
    transform:translateY(-45px);
  }

}

/* ORBITAS */

.orbit{

  position:absolute;

  border-radius:50%;

  border:1px solid #ffffff11;

  animation:spin linear infinite;

}

.o1{

  width:700px;
  height:700px;

  animation-duration:25s;

}

.o2{

  width:500px;
  height:500px;

  animation-duration:18s;

}

.o3{

  width:300px;
  height:300px;

  animation-duration:12s;

}

@keyframes spin{

  from{
    transform:rotate(0deg);
  }

  to{
    transform:rotate(360deg);
  }

}

/* CARD */

.calc{

  width:380px;

  padding:28px;

  border-radius:35px;

  background:rgba(15,23,42,.72);

  backdrop-filter:blur(20px);

  border:1px solid rgba(255,255,255,.08);

  box-shadow:
  0 0 35px #00e5ff33,
  0 0 70px #7c3aed22,
  0 20px 55px rgba(0,0,0,.7);

  position:relative;

  overflow:hidden;

}

/* GLOW */

.calc::before{

  content:'';

  position:absolute;

  width:220px;
  height:220px;

  background:#00e5ff22;

  border-radius:50%;

  top:-100px;
  right:-100px;

  filter:blur(60px);

}

.calc::after{

  content:'';

  position:absolute;

  width:220px;
  height:220px;

  background:#ff008c22;

  border-radius:50%;

  bottom:-100px;
  left:-100px;

  filter:blur(60px);

}

/* HEADER */

.header{

  position:relative;

  z-index:2;

  text-align:center;

  margin-bottom:25px;

}

.header h1{

  font-family:'Orbitron',sans-serif;

  font-size:2rem;

  letter-spacing:4px;

  background:linear-gradient(90deg,var(--cyan),var(--pink),var(--gold));

  -webkit-background-clip:text;

  -webkit-text-fill-color:transparent;

}

.header p{

  color:#94a3b8;

  font-size:.8rem;

  letter-spacing:4px;

}

/* DISPLAY */

.display{

  position:relative;

  z-index:2;

  background:#020617;

  border-radius:24px;

  padding:18px;

  margin-bottom:24px;

  border:1px solid rgba(255,255,255,.05);

  overflow:hidden;

  text-align:right;

}

.display::before{

  content:'';

  position:absolute;

  width:100%;
  height:100%;

  background:linear-gradient(90deg,#00e5ff11,#7c3aed11);

  top:0;
  left:0;

}

#exp{

  min-height:22px;

  color:#c084fc;

  font-family:'Orbitron',sans-serif;

  font-size:.85rem;

}

#screen{

  font-size:3rem;

  color:#67e8f9;

  font-family:'Orbitron',sans-serif;

  text-shadow:0 0 15px #00e5ff88;

}

/* GRID */

.grid{

  position:relative;

  z-index:2;

  display:grid;

  grid-template-columns:repeat(4,1fr);

  gap:14px;

}

/* BOTONES */

button{

  height:65px;

  border:none;

  border-radius:20px;

  cursor:pointer;

  font-size:1.2rem;

  font-weight:800;

  transition:.15s;

  color:white;

}

/* NUM */

.num{

  background:linear-gradient(145deg,#1e293b,#0f172a);

  color:#67e8f9;

  box-shadow:
  inset 0 1px 0 #ffffff11,
  0 5px 0 #020617;

}

.num:hover{

  transform:translateY(-4px);

  box-shadow:
  0 0 18px #00e5ff55,
  0 5px 0 #020617;

}

/* OPS */

.op{

  background:linear-gradient(145deg,#7c3aed,#9333ea);

  box-shadow:
  inset 0 1px 0 #ffffff22,
  0 5px 0 #581c87;

}

.op:hover{

  filter:brightness(1.1);

}

/* CLEAR */

.clear{

  background:linear-gradient(145deg,#ff008c,#db2777);

  box-shadow:
  inset 0 1px 0 #ffffff22,
  0 5px 0 #831843;

}

/* EQUAL */

.equal{

  grid-column:span 2;

  background:linear-gradient(145deg,#00e5ff,#2563eb);

  box-shadow:
  inset 0 1px 0 #ffffff22,
  0 5px 0 #1d4ed8;

}

.equal:hover{

  filter:brightness(1.1);

}

/* FOOTER */

.footer{

  position:relative;

  z-index:2;

  margin-top:18px;

  text-align:center;

  color:#64748b;

  font-size:.75rem;

  letter-spacing:3px;

}

@media(max-width:500px){

  .calc{

    width:92%;

    padding:22px;

  }

}

</style>

</head>

<body>

<div class="orbit o1"></div>
<div class="orbit o2"></div>
<div class="orbit o3"></div>

<div class="calc">

<div class="header">

<h1>GALAXY</h1>

<p>NEON CALCULATOR</p>

</div>

<div class="display">

<div id="exp"></div>

<div id="screen">0</div>

</div>

<div class="grid">

<button class="clear" onclick="clearAll()">C</button>

<button class="op" onclick="del()">⌫</button>

<button class="op" onclick="setOp('%')">%</button>

<button class="op" onclick="setOp('/')">÷</button>

<button class="num" onclick="num('7')">7</button>

<button class="num" onclick="num('8')">8</button>

<button class="num" onclick="num('9')">9</button>

<button class="op" onclick="setOp('*')">×</button>

<button class="num" onclick="num('4')">4</button>

<button class="num" onclick="num('5')">5</button>

<button class="num" onclick="num('6')">6</button>

<button class="op" onclick="setOp('-')">−</button>

<button class="num" onclick="num('1')">1</button>

<button class="num" onclick="num('2')">2</button>

<button class="num" onclick="num('3')">3</button>

<button class="op" onclick="setOp('+')">+</button>

<button class="num" style="grid-column:span 2;" onclick="num('0')">0</button>

<button class="num" onclick="dot()">.</button>

<button class="equal" onclick="equal()">=</button>

</div>

<div class="footer">

COSMIC • FUTURE • DIGITAL

</div>

</div>

<script>

let a = '';
let b = '';
let op = '';
let reset = false;

const screen = document.getElementById('screen');
const exp = document.getElementById('exp');

function render(){

  screen.innerText = (op === '' ? a : b) || '0';

  exp.innerText = op === '' ? '' : `${a} ${op} ${b}`;

}

function num(n){

  if(reset){

    a = '';
    b = '';
    op = '';
    reset = false;

  }

  if(op === ''){

    a += n;

  }else{

    b += n;

  }

  render();

}

function dot(){

  if(op === ''){

    if(!a.includes('.')){

      a += (a === '' ? '0.' : '.');

    }

  }else{

    if(!b.includes('.')){

      b += (b === '' ? '0.' : '.');

    }

  }

  render();

}

function setOp(o){

  if(a === '') a = '0';

  if(b !== '') equal();

  op = o;

  reset = false;

  render();

}

function equal(){

  if(a === '' || b === '' || op === '') return;

  let n1 = parseFloat(a);
  let n2 = parseFloat(b);

  let res = 0;

  switch(op){

    case '+':
      res = n1 + n2;
    break;

    case '-':
      res = n1 - n2;
    break;

    case '*':
      res = n1 * n2;
    break;

    case '/':
      res = n2 !== 0 ? n1 / n2 : 'Error';
    break;

    case '%':
      res = n1 % n2;
    break;

  }

  a = String(res);

  b = '';

  op = '';

  reset = true;

  render();

}

function clearAll(){

  a = '';
  b = '';
  op = '';
  reset = false;

  render();

}

function del(){

  if(op === ''){

    a = a.slice(0,-1);

  }else{

    b = b.slice(0,-1);

  }

  render();

}

render();

</script>

</body>

</html>
